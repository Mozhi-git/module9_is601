name: CI/CD

on:
  push:
    branches: [ main, module10-secure-users ]
  pull_request:
    branches: [ main, module10-secure-users ]


jobs:
 test:
   runs-on: ubuntu-latest

   services:
     postgres:
       image: postgres:16
       env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: module10_test_db
       ports:
         - 5432:5432
       options: >-
         --health-cmd "pg_isready -U postgres"
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5

   env:
     DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/module10_test_db

   steps:

     - uses: actions/checkout@v3
     - uses: actions/setup-python@v4
       with:
        python-version: '3.12'
         
     - uses: actions/cache@v3
       with:
         path: |
           venv
           ~/.cache/pip
         key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
         restore-keys: |
           ${{ runner.os }}-pip-

     - name: Install dependencies
       run: |
         python -m venv venv
         source venv/bin/activate
         pip install -r requirements.txt
         playwright install

     
     - name: Create PostgreSQL test tables
       run: |
         source venv/bin/activate
         python -c "from app.database import get_engine; from app.models import Base; engine = get_engine(); Base.metadata.create_all(bind=engine); engine.dispose()"

       
     - name: Run tests
       run: |
         source venv/bin/activate
         mkdir -p test-results
         python -m pytest tests/unit/ tests/integration/ --cov=app --cov-report=term-missing --junitxml=test-results/junit.xml
         python -m pytest tests/e2e/

         
     - name: Build Docker image
       run: docker build -t module10-calculator:ci .

       
     - name: Scan Docker image with Trivy
       uses: aquasecurity/trivy-action@v0.36.0
       with:
         image-ref: 'module10-calculator:ci'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'

         
     - name: Login to Docker Hub
       if: github.event_name == 'push'
       uses: docker/login-action@v3
       with:
         username: ${{ vars.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Push Docker image to Docker Hub
       if: github.event_name == 'push'
       run: |
         IMAGE_TAG="${GITHUB_REF_NAME}"
         if [ "$IMAGE_TAG" = "main" ]; then
           IMAGE_TAG="latest"
         fi
         docker tag module10-calculator:ci \
           "${{ vars.DOCKERHUB_USERNAME }}/module10-calculator:${IMAGE_TAG}"
         docker push \
           "${{ vars.DOCKERHUB_USERNAME }}/module10-calculator:${IMAGE_TAG}"





 